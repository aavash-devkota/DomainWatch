name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened? }
    validations: { required: true }
  - type: textarea
    id: expect
    attributes: { label: What did you expect? }
  - type: input
    id: version
    attributes: { label: domain-monitor --version }
